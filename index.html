<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Geschützte Vorschau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0d1828; --surface: #142238; --ink: #eef1f5; --muted: #a7b2c4; --accent: #f5b301; --accent-ink: #0d1828; --paper: #e7e9ec; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Libre Franklin", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; min-height: 100svh; padding: 8px; }
.gate { width: min(100%, 440px); display: grid; gap: 8px; }
.tile { background: var(--surface); padding: 24px; }
.tile--paper { background: var(--paper); color: var(--bg); }
h1 { margin: 0; font-size: clamp(2rem, 1.3rem + 3.2vw, 3rem); line-height: 1; letter-spacing: -0.04em; font-weight: 700; }
p { margin: 12px 0 0; font-size: 1.0625rem; line-height: 1.45; font-weight: 500; }
label { display: block; font-weight: 500; margin-bottom: 10px; }
input { width: 100%; height: 56px; border: 0; padding: 0 16px; background: #1b2c47; color: var(--ink); font: inherit; font-size: 1.0625rem; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { width: 100%; height: 56px; margin-top: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 1.0625rem; cursor: pointer; transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1); }
button:active { transform: scale(0.98); }
button[disabled] { opacity: 0.7; cursor: progress; }
.error { color: var(--accent); min-height: 1.45em; margin-top: 12px; }
</style>
</head>
<body>
<main class="gate">
  <div class="tile tile--paper">
    <h1>textomedia</h1>
    <p>Entwurf einer neuen Website. Bitte geben Sie das Passwort ein, um die Vorschau zu öffnen.</p>
  </div>
  <form class="tile" id="gate">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Vorschau öffnen</button>
    <p class="error" id="err" role="alert"></p>
  </form>
</main>

  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = 'tm-preview-key';
  const open = async (key) => {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(DATA.iv) }, key, u8(DATA.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  };
  const derive = async (pw) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  };
  // reopen without asking again in the same browser tab session
  try {
    const saved = sessionStorage.getItem(KEY);
    if (saved) crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', true, ['decrypt']).then(open).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} });
  } catch (e) {}
  const form = document.getElementById('gate'), err = document.getElementById('err'), btn = form.querySelector('button');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Wird geöffnet …';
    try {
      const key = await derive(document.getElementById('pw').value);
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(DATA.iv) }, key, u8(DATA.ct));
      try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
      const html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = 'Das Passwort stimmt nicht.';
      btn.disabled = false; btn.textContent = 'Vorschau öffnen';
    }
  });
})();
